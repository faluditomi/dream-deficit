schema: spec-driven

# Project context shown to AI when creating artifacts.
context: |
  Dream Deficit — 2D Unity game (chat-log analysis / flag placement gameplay).
  Unity 6000.3.8f1 (Unity 6), URP 17.3.0, uGUI + TextMeshPro, New Input System,
  Addressables 2.8.1. Scenes: "v1_prototye.unity" (desktop/play, note the
  filename typo), "tutorial_demo.unity", "main_menu.unity", plus dream scenes
  under Assets/Dreams/.

  Architecture:
  - Managers (Singleton pattern): GameManager, SaveManager, FlagManager,
    AddressableManager, HighlightManager, ConversationManager, ChatLogManager,
    SequenceEventManager, UIFocusManager under Assets/Scripts/MonoBehaviours/Managers/
  - Data classes (POCOs) under Assets/Scripts/Plain Old/: DayData, RunData,
    FlagData, ChatBubble, FlagType, Constants, ChatLogEntry, plus conversation
    data (ConversationNodeData, ConversationEdgeData, ConversationGraphEnums,
    ConversationConditionClause, ConversationEffectData) AND ConversationRunner
    (a plain C# class, not a MonoBehaviour)
  - ScriptableObjects under Assets/ScriptableObjects/: ChatLog, ChatUser,
    ConversationGraph, SequenceEventChannel, GameTemplate, SaveSlot, DoubleMarker
    (ConversationGraph assets live in per-character folders under ConversationGraphs/)
  - Chat log content: a ChatLog resolves its graphs by Addressable name prefix
    (asset name starts with the log's name); graphs consist of Entry/Bubble/Choice/
    Wait/End nodes + a flat edge list. ConversationManager owns one ConversationRunner
    per chat log (entry evaluation by SequenceEvent, thread walk, wait/choice parking,
    day-blocking choices). Authored via "Custom Tools/Conversation Graph Editor".
    Input ports are Multi (fan-in), output/option ports Single (runtime follows only
    the first edge).
  - Effects: SetSignal or RaiseEvent, authored on choice options and bubble nodes,
    each with an optional delay. Zero-delay effects apply synchronously; positive
    delays queue in ConversationManager and are runtime-only.
  - Day progression: GameManager.TriggerDayTimePassing() / EndDay()
  - Flags: FlagManager places keyboard-driven flags on chat text, scored by
    overlap accuracy against Flaggable targets (distinct from DoubleMarker scoring)
  - Save: SaveManager persists JSON via JsonUtility; SaveSlot + GameTemplate init
    new saves. Day-scoped state uses IDaySavable/IDayLoadable (DayData); run-scoped
    state uses IRunSavable/IRunLoadable (RunData). Registration is automatic via
    SaveLoadBehaviour; never scene-scan. Save methods copy collections, never alias.
    Only persistent singletons own slices. ConversationManager snapshots run-level
    chat state.

  Guardrails for any implementation work:
  - NEVER edit .asset/.prefab/.unity/.csproj/.sln files (binary/YAML, corrupts)
  - All prefabs/data load via AddressableManager.Instance.RetrieveAddressable<T>(address)
  - Managers accessed via Instance singletons; save fields must stay JsonUtility-serializable
  - Keep day-scoped state in DayData and run-scoped state in RunData
  - Known TODOs: save slot picker menu, async Addressables,
    multi-flag safeguard, menu-triggered game loading

# Per-artifact rules (optional)
rules:
  proposal:
    - Keep proposals concise; one change = one coherent unit of work
    - Always state what is out of scope (non-goals)
  tasks:
    - Group tasks by script boundary (Managers / Controllers / Handlers / Plain Old)
    - Mark serialization-safe constraints on any save-related task
